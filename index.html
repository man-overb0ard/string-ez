<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const theme = localStorage.getItem('string-ez-theme');
        if (['alcaraz', 'guga', 'agassi', 'federer', 'nadal', 'djokovic', 'sinner', 'sampras', 'jungle'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch { /* O tema padrão funciona sem armazenamento. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24563e" />
    <meta name="description" content="Encontre três sugestões de cordas para o seu jogo de tênis." />
    <title>string-ez | strings tuned to your game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
